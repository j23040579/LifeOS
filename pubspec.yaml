name: lifeos
description: Android-first LifeOS with offline planning, learning and progress tools.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  archive: 4.5.2
  crypto: 3.0.7
  csv: 8.0.0
  drift: 2.35.3
  drift_flutter: 0.3.1
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  http: 1.6.0
  pdfrx: 2.10.1
  timezone: 0.11.2
  xml: 7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/InterVariable.ttf
